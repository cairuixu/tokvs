<script>
(function () {
  'use strict';
  var isEn = document.documentElement.lang === 'en';
  function T(zh, en) { return isEn ? en : zh; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var TYPE_LABEL = {
    unlock: { zh: '代币解锁', en: 'Unlock' },
    airdrop: { zh: '空投', en: 'Airdrop' },
    tge: { zh: 'TGE / 上线', en: 'TGE / Listing' },
    event: { zh: '行业事件', en: 'Event' }
  };
  function typeLabel(t) {
    var m = TYPE_LABEL[t] || TYPE_LABEL.event;
    return isEn ? m.en : m.zh;
  }
  function dataUrl(rel) { return new URL(rel, document.baseURI).href; }
  var el = document.getElementById('cal-list');
  fetch(dataUrl('data/calendar.json'))
    .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
    .then(function (d) {
      if (!Array.isArray(d) || !d.length) throw new Error('empty');
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var cutoff = new Date(today.getTime() - 7 * 864e5);
      var items = d
        .filter(function (e) { return e && e.date && new Date(e.date + 'T00:00:00') >= cutoff; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      if (!items.length) throw new Error('empty');
      var html = '';
      items.forEach(function (e) {
        var past = new Date(e.date + 'T00:00:00') < today;
        html += '<div class="cal-item' + (past ? ' past' : '') + '">' +
          '<div class="cal-date">' + esc(e.date) + '</div>' +
          '<div class="cal-body">' +
          '<span class="atype type-' + esc(e.type || 'event') + '">' + esc(typeLabel(e.type)) + '</span>' +
          '<h3>' + esc(isEn ? e.title_en : e.title_zh) + '</h3>' +
          '<p>' + esc(isEn ? e.desc_en : e.desc_zh) + '</p>' +
          (e.link ? '<a class="more" href="' + esc(e.link) + '" target="_blank" rel="noopener">' +
            T('查看原文 →', 'Source →') + '</a>' : '') +
          '</div></div>';
      });
      el.innerHTML = html;
    })
    .catch(function () {
      el.innerHTML = '<div class="load-fail">' +
        T('日历加载失败，请稍后刷新重试', 'Calendar unavailable, please refresh and retry later') + '</div>';
    });
})();
</script>
